name: Linux Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release-linux:
    name: Linux AppImage release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.25"
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Linux PDF runtime dependencies
        run: bash packaging/linux/install-pdf-dependencies.sh

      - name: Validate Linux PDF dependency scripts
        run: bash -n packaging/linux/*.sh

      - name: Install Python dependencies
        run: uv sync --locked --extra dev --extra desktop

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate release metadata
        run: uv run python scripts/validate_release.py --tag "${{ github.ref_name }}" --notes-out release-notes.md

      - name: Run Python tests
        run: uv run pytest

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Linux AppImage
        working-directory: frontend
        run: npm run desktop:build

      - name: Smoke test release sidecar
        run: |
          target_triple="$(rustc -vV | awk '/^host:/ { print $2 }')"
          sidecar="frontend/src-tauri/binaries/resumecr7-backend-${target_triple}"
          uv run --extra desktop python scripts/smoke_desktop_sidecar.py --binary "${sidecar}" --timeout-seconds 30

      - name: Collect release assets
        run: |
          mkdir -p dist/release
          cp frontend/src-tauri/target/release/bundle/appimage/*.AppImage dist/release/
          cp packaging/linux/install-pdf-dependencies.sh dist/release/resumecr7-install-pdf-dependencies.sh
          cp packaging/linux/check-pdf-dependencies.sh dist/release/resumecr7-check-pdf-dependencies.sh
          cd dist/release
          for artifact in *.AppImage; do
            test -s "${artifact}"
            sha256sum "${artifact}" > "${artifact}.sha256"
          done

      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/release/* --clobber
          else
            gh release create "${{ github.ref_name }}" \
              dist/release/* \
              --draft \
              --title "ResumeCR7 ${{ github.ref_name }}" \
              --notes-file release-notes.md
          fi
